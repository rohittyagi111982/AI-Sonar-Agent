<section id="recommendations-section">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="section-title mb-1">Recommendations</h3>
            <p class="text-muted mb-0">
                Prioritized actions based on the SonarQube analysis
            </p>
        </div>
    </div>

    <!-- High Priority -->
    <div class="card mb-4">
        <div class="card-header d-flex align-items-center">
            <span class="badge bg-danger me-2">HIGH</span>
            High Priority
        </div>

        <div class="card-body">
            <div class="recommendation-list">
                {{HighPriorityRecommendations}}
            </div>
        </div>
    </div>

    <!-- Medium Priority -->
    <div class="card mb-4">
        <div class="card-header d-flex align-items-center">
            <span class="badge bg-warning text-dark me-2">MEDIUM</span>
            Medium Priority
        </div>

        <div class="card-body">
            <div class="recommendation-list">
                {{MediumPriorityRecommendations}}
            </div>
        </div>
    </div>

    <!-- Low Priority -->
    <div class="card mb-4">
        <div class="card-header d-flex align-items-center">
            <span class="badge bg-success me-2">LOW</span>
            Low Priority
        </div>

        <div class="card-body">
            <div class="recommendation-list">
                {{LowPriorityRecommendations}}
            </div>
        </div>
    </div>

    <!-- Conclusion -->
    <div class="card">
        <div class="card-header">
            Conclusion
        </div>

        <div class="card-body">
            <p class="mb-0">
                {{Conclusion}}
            </p>
        </div>
    </div>

</section>
