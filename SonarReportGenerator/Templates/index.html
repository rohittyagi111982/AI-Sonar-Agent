<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>SonarQube AI Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            overflow: hidden;
            background: #f5f7fb;
            font-family: "Segoe UI", sans-serif;
        }

        .topbar {
            height: 60px;
            background: #0d6efd;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            box-shadow: 0 3px 8px rgba(0,0,0,.15);
        }

        .sidebar {
            width: 250px;
            height: calc(100vh - 60px);
            background: #212529;
            color: white;
            position: fixed;
            left: 0;
            top: 60px;
        }

            .sidebar .nav-link {
                color: #ced4da;
                padding: 14px 20px;
                font-size: 15px;
            }

                .sidebar .nav-link:hover,
                .sidebar .nav-link.active {
                    background: #0d6efd;
                    color: white;
                }

        .content {
            margin-left: 250px;
            margin-top: 60px;
            height: calc(100vh - 60px);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

            .logo i {
                margin-right: 10px;
            }

        .footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            text-align: center;
            color: #adb5bd;
            padding: 15px;
            font-size: 13px;
        }
    </style>

</head>

<body>

    <div class="topbar">

        <div class="logo">
            <i class="bi bi-bar-chart-fill"></i>
            SonarQube AI Dashboard
        </div>

        <div>

            <span class="me-4">
                <i class="bi bi-folder-fill"></i>
                {{ProjectName}}
            </span>

            <span>
                <i class="bi bi-calendar-event"></i>
                {{GeneratedOn}}
            </span>

        </div>

    </div>

    <div class="sidebar">

        <div class="list-group list-group-flush">

            <a href="pages/summary.html"
               target="contentFrame"
               class="list-group-item list-group-item-action nav-link active">

                <i class="bi bi-speedometer2"></i>

                Executive Summary

            </a>

            <a href="pages/issues.html"
               target="contentFrame"
               class="list-group-item list-group-item-action nav-link">

                <i class="bi bi-bug-fill"></i>

                Issues

            </a>

            <a href="pages/technical-debt.html"
               target="contentFrame"
               class="list-group-item list-group-item-action nav-link">

                <i class="bi bi-tools"></i>

                Technical Debt

            </a>

            <a href="pages/recommendations.html"
               target="contentFrame"
               class="list-group-item list-group-item-action nav-link">

                <i class="bi bi-lightbulb-fill"></i>

                Recommendations

            </a>

        </div>

        <div class="footer">

            AI Generated Report

            <br>

            Powered by GPT + MCP

        </div>

    </div>

    <div class="content">

        <iframe src="pages/summary.html"
                name="contentFrame">
        </iframe>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        document.querySelectorAll(".nav-link").forEach(x => {

            x.addEventListener("click", function () {

                document.querySelectorAll(".nav-link")
                    .forEach(y => y.classList.remove("active"));

                this.classList.add("active");

            });

        });

    </script>

</body>

</html>
