<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ProjectName}} - SonarQube Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">   
    <link rel="stylesheet"     href="./dashboard.css">
</head>
<body>

<div class="d-flex">

    <nav class="sidebar bg-dark text-white p-3 vh-100">
        <h4 class="mb-4">Sonar Report</h4>

        <div class="nav flex-column nav-pills" id="reportTabs" role="tablist">

            <button class="nav-link active"
                    data-bs-toggle="pill"
                    data-bs-target="#summary"
                    type="button">
                Executive Summary
            </button>

            <button class="nav-link"
                    data-bs-toggle="pill"
                    data-bs-target="#issues"
                    type="button">
                Issues
            </button>

            <button class="nav-link"
                    data-bs-toggle="pill"
                    data-bs-target="#debt"
                    type="button">
                Technical Debt
            </button>

            <button class="nav-link"
                    data-bs-toggle="pill"
                    data-bs-target="#recommendations"
                    type="button">
                Recommendations
            </button>

        </div>
    </nav>

    <main class="container-fluid p-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2>{{ProjectName}}</h2>
                <small>Generated On : {{GeneratedOn}}</small>
            </div>

            <div>
                <span class="badge bg-primary">{{QualityGate}}</span>
            </div>
        </div>

        <div class="tab-content">

            <div class="tab-pane fade show active"
                 id="summary">

                {{ExecutiveSummarySection}}

            </div>

            <div class="tab-pane fade"
                 id="issues">

                {{IssuesSection}}

            </div>

            <div class="tab-pane fade"
                 id="debt">

                {{TechnicalDebtSection}}

            </div>

            <div class="tab-pane fade"
                 id="recommendations">

                {{RecommendationSection}}

            </div>

        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="dashboard.js"></script>

</body>
</html>
